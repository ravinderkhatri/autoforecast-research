schema_version: 1
dataset:
  id: m5_daily
  panel:
    series_col: id
    time_col: date
    target_col: qty
    exposure_col: observation_state
    # M5 released the calendar and sell-price schedule for d_1942..d_1969 with the
    # evaluation data.  It is therefore a known-at-origin feature for this archived
    # contest replay.  Do not copy this declaration to client data unless an
    # effective-dated planned-price feed proves the same fact.
    known_future: [sell_price]
    price_col: sell_price
    static: [dept_id, cat_id, state_id, store_id]
    factor_group: state_id
    product_col: item_id
    store_col: store_id
    category_col: dept_id
    frequency: D
    season_length: 7
