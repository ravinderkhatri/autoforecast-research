schema_version: 2
model:
  id: pact
  adapter: pact
  family: mft
  runtime: custom_torch
  status: candidate
  tags: [autoforecast, development, decoder_only, revision, pact]
implementation:
  config: configs/experiments/multibranch_revisions/pact_campaign_default.json
  sha256: c83dbebed73427b70fd347a9de1f553a23ea734d8a258a46253b4d53a0334267
hyperparameters:
  model.encoder_days:
    default: 371
    valid: {kind: int, low: 28, high: 1911, step: 7}
    search: {kind: categorical, values: [112, 371, 728, 1911]}
  model.d_model:
    default: 64
    valid: {kind: int, low: 8, high: 512, step: 8}
    search: {kind: categorical, values: [32, 64, 96, 128]}
  model.n_heads:
    default: 4
    valid: {kind: int, low: 1, step: 1}
    search: {kind: categorical, values: [2, 4, 8]}
  model.trunk_stages:
    default: 4
    valid: {kind: int, low: 1, step: 1}
    search: {kind: categorical, values: [2, 4, 6]}
  model.covariate_dropout:
    default: 0.0
    valid: {kind: categorical, values: [0.0]}
    search: {kind: categorical, values: [0.0]}
  training.learning_rate:
    default: 0.0003
    valid: {kind: float, low: 0.000001, high: 0.01, log: false}
    search: {kind: float, low: 0.00003, high: 0.003, log: true}
  training.train_stride:
    default: 1
    valid: {kind: categorical, values: [1, 2, 3, 4, 5, 6, 8]}
    search: {kind: categorical, values: [1, 2, 4]}
  training.train_windows:
    default: 52
    valid: {kind: int, low: 7, high: 128, step: 1}
    search: {kind: categorical, values: [14, 28, 52]}
  training.series_loss_weighting:
    default: uniform
    valid: {kind: categorical, values: [uniform, revenue, output_gradient]}
    search: {kind: categorical, values: [uniform]}
constraints:
  - kind: divisible
    dividend: model.d_model
    divisor: model.n_heads
