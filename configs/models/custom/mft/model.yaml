schema_version: 2
model:
  id: mft
  adapter: mft
  family: custom
  runtime: custom_torch
  status: candidate
  tags: [autoforecast, development, finetune]
hyperparameters:
  model.encoder_days:
    default: 28
    valid: {kind: int, low: 7, high: 4095, step: 1}
    search: {kind: categorical, values: [28, 56]}
  model.trunk_stages:
    default: 4
    valid: {kind: int, low: 1, high: 8, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.decoder_layers:
    default: 4
    valid: {kind: int, low: 1, high: 8, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.history_attention_layers:
    default: 4
    valid: {kind: int, low: 1, high: 8, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.commercial_attention_layers:
    default: 4
    valid: {kind: int, low: 1, high: 8, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.event_kernel_layers:
    default: 4
    valid: {kind: int, low: 1, high: 8, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.d_model:
    default: 64
    valid: {kind: int, low: 8, high: 512, step: 8}
    search: {kind: categorical, values: [32, 64, 96, 128]}
  model.heads:
    default: 4
    valid: {kind: categorical, values: [1, 2, 4, 8, 16]}
    search: {kind: categorical, values: [2, 4, 8]}
  model.patch_size:
    default: 7
    valid: {kind: int, low: 1, high: 364, step: 1}
    search: {kind: categorical, values: [7, 14]}
  model.factor_rank:
    default: 8
    valid: {kind: int, low: 1, high: 64, step: 1}
    search: {kind: categorical, values: [4, 8, 12]}
  model.factor_dynamics:
    default: ar1
    valid: {kind: categorical, values: [ar1, iid]}
    search: {kind: categorical, values: [ar1, iid]}
  model.demand_branch_dropout:
    default: 0.15
    valid: {kind: float, low: 0.0, high: 0.95, log: false}
    search: {kind: float, low: 0.05, high: 0.25, log: false}
  model.covariate_dropout:
    default: 0.2
    valid: {kind: float, low: 0.0, high: 0.95, log: false}
    search: {kind: float, low: 0.0, high: 0.3, log: false}
  training.learning_rate:
    default: 0.001
    valid: {kind: float, low: 0.000001, high: 1.0, log: false}
    search: {kind: float, low: 0.0001, high: 0.003, log: true}
constraints:
  - kind: divisible
    dividend: model.d_model
    divisor: model.heads
  - kind: divisible
    dividend: model.encoder_days
    divisor: model.patch_size
