schema_version: 2
model:
  id: sft
  adapter: sft
  family: mft
  runtime: custom_torch
  status: candidate
  tags: [autoforecast, development, revision, sft]
implementation:
  config: configs/experiments/multibranch_revisions/sft_campaign_default.json
  sha256: ac13cb127233ac19496cb841587903870b599fab7991a0fdfea59f46ee55fa8c
hyperparameters:
  model.encoder_days:
    default: 364
    valid: {kind: int, low: 28, high: 1911, step: 7}
    search: {kind: categorical, values: [112, 364, 728, 1911]}
  model.d_model:
    default: 64
    valid: {kind: int, low: 8, high: 512, step: 8}
    search: {kind: categorical, values: [32, 64, 96, 128]}
  model.n_heads:
    default: 4
    valid: {kind: int, low: 1, step: 1}
    search: {kind: categorical, values: [2, 4, 8]}
  model.trunk_stages:
    default: 4
    valid: {kind: int, low: 1, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.decoder_layers:
    default: 4
    valid: {kind: int, low: 1, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.history_attention_layers:
    default: 4
    valid: {kind: int, low: 1, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.commercial_attention_layers:
    default: 4
    valid: {kind: int, low: 1, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.event_kernel_layers:
    default: 4
    valid: {kind: int, low: 1, step: 1}
    search: {kind: categorical, values: [1, 2, 4]}
  model.commercial_attention_heads:
    default: 2
    valid: {kind: int, low: 1, step: 1}
    search: {kind: categorical, values: [1, 2, 4, 8]}
  model.demand_dropout:
    default: 0.1
    valid: {kind: float, low: 0.0, high: 0.95, log: false}
    search: {kind: categorical, values: [0.0, 0.1, 0.2]}
  model.covariate_dropout:
    default: 0.2
    valid: {kind: float, low: 0.0, high: 0.95, log: false}
    search: {kind: categorical, values: [0.0, 0.2, 0.4]}
  model.patch_size:
    default: 7
    valid: {kind: int, low: 1, high: 1911, step: 1}
    search: {kind: categorical, values: [7]}
  training.learning_rate:
    default: 0.0003
    valid: {kind: float, low: 0.000001, high: 0.01, log: false}
    search: {kind: float, low: 0.00003, high: 0.003, log: true}
  training.train_stride:
    default: 28
    valid: {kind: int, low: 1, high: 112, step: 1}
    search: {kind: categorical, values: [7, 14, 28]}
  training.train_windows:
    default: 52
    valid: {kind: int, low: 1, high: 128, step: 1}
    search: {kind: categorical, values: [13, 26, 52]}
  training.series_loss_weighting:
    default: uniform
    valid: {kind: categorical, values: [uniform, revenue, output_gradient]}
    search: {kind: categorical, values: [uniform]}
constraints:
  - kind: divisible
    dividend: model.d_model
    divisor: model.n_heads
  - kind: divisible
    dividend: model.d_model
    divisor: model.commercial_attention_heads
  - kind: divisible
    dividend: model.encoder_days
    divisor: model.patch_size
