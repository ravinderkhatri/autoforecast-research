schema_version: 2
model:
  id: shallow_global
  adapter: shallow_global
  family: global
  runtime: shallow
  status: candidate
  tags: [autoforecast, development, lightgbm]
hyperparameters:
  model.num_leaves:
    default: 63
    valid: {kind: int, low: 2, high: 4095, step: 1}
    search: {kind: int, low: 31, high: 127, step: 32}
  model.min_data_in_leaf:
    default: 200
    valid: {kind: int, low: 1, high: 1000000, step: 1}
    search: {kind: int, low: 50, high: 300, step: 50}
  model.num_boost_round:
    default: 300
    valid: {kind: int, low: 1, high: 100000, step: 1}
    search: {kind: int, low: 100, high: 500, step: 100}
  training.learning_rate:
    default: 0.05
    valid: {kind: float, low: 0.000001, high: 1.0, log: false}
    search: {kind: float, low: 0.01, high: 0.1, log: true}
