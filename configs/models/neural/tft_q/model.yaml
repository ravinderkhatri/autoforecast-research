schema_version: 2
model:
  id: tft_q
  adapter: tft_q
  family: temporal_fusion_transformer
  runtime: tft
  status: candidate
  tags: [autoforecast, development, tft, quantile, reference_profile]
hyperparameters:
  model.hidden_size:
    default: 50
    valid: {kind: int, low: 50, high: 50, step: 1}
    search: {kind: categorical, values: [50]}
  model.hidden_continuous_size:
    default: 8
    valid: {kind: int, low: 8, high: 8, step: 1}
    search: {kind: categorical, values: [8]}
  model.attention_head_size:
    default: 2
    valid: {kind: int, low: 2, high: 2, step: 1}
    search: {kind: categorical, values: [2]}
  model.dropout:
    default: 0.25
    valid: {kind: categorical, values: [0.25]}
    search: {kind: categorical, values: [0.25]}
  model.max_encoder_length:
    default: 364
    valid: {kind: int, low: 364, high: 364, step: 1}
    search: {kind: categorical, values: [364]}
  model.min_encoder_length:
    default: 7
    valid: {kind: int, low: 7, high: 7, step: 1}
    search: {kind: categorical, values: [7]}
  model.lag_short_days:
    default: 7
    valid: {kind: int, low: 7, high: 7, step: 1}
    search: {kind: categorical, values: [7]}
  model.lag_long_days:
    default: 42
    valid: {kind: int, low: 42, high: 42, step: 1}
    search: {kind: categorical, values: [42]}
  model.output_size:
    default: 4
    valid: {kind: categorical, values: [4]}
    search: {kind: categorical, values: [4]}
  model.loss_kind:
    default: quantile
    valid: {kind: categorical, values: [quantile]}
    search: {kind: categorical, values: [quantile]}
  training.learning_rate:
    default: 0.015
    valid: {kind: categorical, values: [0.015]}
    search: {kind: categorical, values: [0.015]}
constraints:
  - kind: less_equal
    dividend: model.attention_head_size
    divisor: model.hidden_size
