# Non-executable legacy fixture, retained for historical request compatibility.
# The current runner refuses this archived-final scoring format. For a governed replay, use
# m5_private_evaluation_deep_v2.yaml after completing its public-holdout selection lock.
# Do not rewrite this frozen request or treat its archived labels as a blind evaluation.
schema_version: 2
run:
  name: m5-private-evaluation-replay
  dataset_contract: configs/datasets/m5_daily.yaml
  model_catalog: configs/models
  models: [mft]
  origin: "2016-05-22"
  horizon: 28
  tracking:
    mlflow: {enabled: false}
  evaluation:
    # The M5 evaluation panel is dense. Missing labels are a broken snapshot, never zero demand.
    missing_actual: no_data
    metric: wrmsse
