# Archived M5 private-evaluation replay.  This is the only request that may be compared to the
# published M5 Accuracy leaderboard: origin d_1941 (2016-05-22), targets d_1942..d_1969, and the
# 12-level dollar-weighted WRMSSE convention.  It is not a blind competition submission because
# the completed competition's labels are now public; freeze the profile before running it.
schema_version: 2
run:
  name: m5-private-evaluation-replay
  dataset_contract: configs/datasets/m5_daily.yaml
  model_catalog: configs/models
  models: [mft]
  origin: "2016-05-22"
  horizon: 28
  tracking:
    mlflow: {enabled: false}
  evaluation:
    # The M5 evaluation panel is dense. Missing labels are a broken snapshot, never zero demand.
    missing_actual: no_data
    metric: wrmsse
