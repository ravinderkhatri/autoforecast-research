# LEGACY DESIGN RECORD ONLY: the compiler refuses this long combined SFT/HMFNet run.
# Use the separate m5_sft_competition_benchmark.yaml and m5_hmfnet_competition_benchmark.yaml
# requests for new work, or the separate per-model research_campaign requests for robustness.
# Data paths remain runtime inputs; this file freezes the historical experiment design.
schema_version: 4
forecast_campaign:
  name: m5-sft-hmfnet-50k
  dataset:
    contract: configs/datasets/m5_daily.yaml
    selection:
      source_uri: local://m5-public-selection-v1
    final_training:
      source_uri: local://m5-final-training-v1
    final_score:
      source_uri: kaggle://m5/organizer-private-replay-v1
  models:
    catalog: configs/models
    candidates:
      - model_id: sft
        parameters:
          mode: manual
          values:
            # SFT architecture: edit these values for a deliberate manual experiment.
            model.encoder_days: 1911
            model.d_model: 80
            model.n_heads: 10
            model.patch_size: 7
            model.trunk_stages: 10
            model.decoder_layers: 10
            model.history_attention_layers: 10
            model.commercial_attention_layers: 10
            model.event_kernel_layers: 10
            model.commercial_attention_heads: 10
            model.demand_dropout: 0.1
            model.covariate_dropout: 0.2
            training.learning_rate: 0.0003
            training.train_stride: 28
            training.train_windows: 52
            training.series_loss_weighting: uniform
      - model_id: hmfnet
        parameters:
          mode: manual
          values:
            # HMFNet architecture: edit these values for a deliberate manual experiment.
            model.encoder_days: 1911
            model.d_model: 80
            model.n_heads: 10
            model.trunk_stages: 10
            model.covariate_dropout: 0.2
            training.learning_rate: 0.0003
            training.train_stride: 28
            training.train_windows: 52
            training.series_loss_weighting: uniform
  temporal:
    training_start: null
    initialization_origin: "2016-02-28"
    validation_origins: ["2016-03-27", "2016-04-24"]
    validation_horizon: 28
    final_train_cutoff: "2016-05-22"
    final_test_horizon: 28
  seeds: [0, 1, 2]
  # Registered SFT/HMFNet currently support fresh initialization only.
  initialization_arms: [fresh]
  selection:
    metric: wrmsse
    missing_actual: no_data
    direction: minimize
    tie_break: [mean_score, score_stddev, model_id, variant_id, initialization]
  final_evidence_role: archived_private_replay_not_blind
  budgets:
    initialization:
      maximum_epochs: 50000
      patience: 10
      timeout_seconds: 86400
      max_attempts: 2
      early_stopping_absolute_min_delta: 0.000001
      early_stopping_relative_min_delta: 0.0
    validation:
      maximum_epochs: 50000
      patience: 10
      timeout_seconds: 86400
      max_attempts: 2
      early_stopping_absolute_min_delta: 0.000001
      early_stopping_relative_min_delta: 0.0
    final_fit:
      maximum_epochs: 50000
      patience: 10
      timeout_seconds: 86400
      max_attempts: 2
      early_stopping_absolute_min_delta: 0.000001
      early_stopping_relative_min_delta: 0.0
  compute:
    # Both variants retain float64 likelihood arithmetic and currently support CPU/CUDA, not MPS.
    device: cpu
    # The preceding 512-row attempt was macOS-killed before its first update.
    # SFT/HMFNet require equal logical and physical batch sizes, so freeze both at 256.
    batch_size: 256
    gradient_microbatch_size: 256
    memory_gib: 16
    min_free_disk_gib: 0
  tracking:
    mlflow: true
