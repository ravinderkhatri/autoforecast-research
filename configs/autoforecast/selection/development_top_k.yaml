# A pre-ranking policy, not a mutable list of winners. The evaluation harness must resolve all
# matching candidates, apply registered eligibility gates, rank only on frozen development origins,
# and write the resulting top-K as an immutable evidence artifact with source/config hashes.
# Change `top_k` for a new, reviewed selection policy; do not overwrite an existing policy cited by
# a selection lock.
schema_version: 1
selection:
  id: autoforecast_development_top_k
  candidate_tags: [autoforecast, development]
  statuses: [candidate]
  metric: wrmsse
  direction: minimize
  top_k: 5
