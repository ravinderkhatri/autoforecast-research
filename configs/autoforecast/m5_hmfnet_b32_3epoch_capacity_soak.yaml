# Fully governed HMFNet capacity diagnostic at the production B32 setting.
# It runs three epochs in both adapter training phases and emits no score or MLflow evidence.
schema_version: 6
forecast_campaign:
  name: m5-hmfnet-b32-3epoch-capacity-soak
  purpose: capacity_diagnostic
  dataset:
    contract: configs/datasets/m5_daily.yaml
    selection:
      source_uri: local://m5-public-selection-v1
    final_training:
      source_uri: local://m5-final-training-v1
    final_score:
      source_uri: kaggle://m5/organizer-private-replay-v1
  models:
    catalog: configs/models
    candidates:
      - model_id: hmfnet
        parameters:
          mode: manual
          values:
            model.encoder_days: 1911
            model.d_model: 80
            model.n_heads: 10
            model.trunk_stages: 10
            model.covariate_dropout: 0.2
            training.learning_rate: 0.0003
            training.train_stride: 28
            training.train_windows: 52
            training.series_loss_weighting: uniform
  temporal:
    training_start: null
    initialization_origin: "2016-02-28"
    validation_origins: ["2016-03-27"]
    validation_horizon: 28
    final_train_cutoff: "2016-05-22"
    final_test_horizon: 28
  seeds: [0]
  initialization_arms: [fresh]
  selection:
    metric: wrmsse
    missing_actual: no_data
    direction: minimize
    tie_break: [mean_score, score_stddev, model_id, variant_id, initialization]
  final_evidence_role: archived_private_replay_not_blind
  budgets:
    initialization:
      maximum_epochs: 3
      patience: 10
      timeout_seconds: 172800
      max_attempts: 1
      early_stopping_absolute_min_delta: 0.000001
      early_stopping_relative_min_delta: 0.0
    validation:
      maximum_epochs: 3
      patience: 10
      timeout_seconds: 172800
      max_attempts: 1
      early_stopping_absolute_min_delta: 0.000001
      early_stopping_relative_min_delta: 0.0
    final_fit:
      maximum_epochs: 3
      patience: 10
      timeout_seconds: 172800
      max_attempts: 1
      early_stopping_absolute_min_delta: 0.000001
      early_stopping_relative_min_delta: 0.0
  compute:
    precision: 32-true
    device: cpu
    batch_size: 32
    gradient_microbatch_size: 32
    memory_gib: 16
    min_free_disk_gib: 0
  tracking:
    mlflow: true
