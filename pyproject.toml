[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforecast"
version = "0.1.0"
description = "Governed, reproducible time-series forecasting"
readme = "README.md"
# The optional AutoGluon runtime currently supports through Python 3.13. Keep the project range
# honest so a lock cannot claim the all-model environment works on a newer interpreter.
requires-python = ">=3.12,<3.14"
# The standard install includes the shared workflow, statistical models, HPO and tracking.
# Extra model libraries remain opt-in below.
dependencies = [
    "PyYAML==6.0.3",
    "pyspark==4.2.0",
    "pyarrow==24.0.0",
    "numpy==2.5.3",
    "pandas==2.3.3",
    "psutil==7.2.2",
    "matplotlib==3.11.1",
    "statsforecast==2.0.1",
    "optuna==5.0.0",
    "ray[tune]==2.58.0",
    "mlflow-skinny==3.13.0",
]

[project.scripts]
autoforecast = "autoforecast.cli:main"

[project.optional-dependencies]
# Existing workflow extra names remain compatible aliases; their libraries are now standard.
timeseries = ["PyYAML==6.0.3", "pyspark==4.2.0", "pyarrow==24.0.0", "numpy==2.5.3", "pandas==2.3.3", "psutil==7.2.2"]
plots = ["matplotlib==3.11.1"]
# Optional dataset acquisition and frame libraries.
data = ["kaggle", "pandas", "pyarrow", "numpy"]
# Importing catalog/static contracts does not start a JVM; forecasting execution requires Java.
spark = ["pyspark>=4,<5", "pyarrow>=24,<26"]
# Declarative candidate-catalog loading is included in the standard install.
catalog = ["PyYAML==6.0.3"]
# Both HPO backends are installed by default and consume the same model-YAML schema.
hpo-optuna = ["PyYAML==6.0.3", "optuna==5.0.0"]
hpo-ray = ["PyYAML==6.0.3", "ray[tune]==2.58.0"]
# Tracking libraries are standard; export to a customer-managed MLflow remains opt-in at runtime.
mlflow-tracking = ["mlflow-skinny==3.13.0", "psutil==7.2.2"]
# Durable overnight supervision needs process-tree RSS enforcement even when MLflow is disabled.
campaign = ["psutil==7.2.2"]
# Model runtimes are intentionally separate: selecting a model profile never installs every deep
# learning stack. `uv.lock` pins the resolved transitive graph for repeatable smoke/gate runs.
classical = ["statsforecast==2.0.1"]
custom-torch = ["torch>=2.5,<3", "tensorboard>=2.18,<3"]
shallow = ["lightgbm>=4,<5", "pandas"]
tft = ["lightning>=2.5,<3", "pytorch-forecasting>=1.3,<2"]
autogluon-zoo = ["autogluon.timeseries>=1.4,<2"]
# PyPI's 1.x package does not expose the repository's governed TimesFM 2.5 API. Pin the official
# source snapshot rather than silently installing an incompatible provider.
timesfm = ["timesfm @ git+https://github.com/google-research/timesfm.git@2f1625c208cf99bd4c9f6650d54796d8f88486f8"]

[dependency-groups]
ci = [
    "pytest==9.1.1",
    "ruff==0.6.9",
    "pyright==1.1.413",
    "build>=1.3,<2",
    "setuptools>=77",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "autoforecast*",
    "forecast*",
    "mlops*",
    "observability*",
    "provenance*",
    "scripts*",
    "spec*",
]
namespaces = true

[tool.setuptools.package-data]

observability = ["sources.json"]

[tool.pytest.ini_options]
# Experiment stores contain copied source for reproducibility, not maintained tests.
# Plain `pytest` must collect the same seven source trees as a clean checkout.
testpaths = [
    "autoforecast",
    "forecast",
    "mlops",
    "observability",
    "provenance",
    "scripts",
    "spec",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["spec", "scripts", "forecast", "autoforecast", "mlops", "observability"]
# Generated artifacts are not maintained source.
exclude = [".git", ".venv", "build", "dist", "mlartifacts"]

[tool.ruff.lint]
# E/F/W pycodestyle+pyflakes, I import order, UP pyupgrade, B bugbear.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Every entry states WHY, so an exemption cannot be inherited by a later file without a reason.
#
# The docstrings in this file are the contract: each default records the measurement and the
# reasoning that set it, and several quote validator messages verbatim so the prose and the
# runtime string cannot drift. Rewrapping those changes the quoted text.
# Demonstration scripts print aligned tables; the alignment is the point of the output.
# The generated figure is laid out by coordinate arithmetic, and the literal rows ARE the figure.
# Test files name the defect they prevent in the test name, which runs long by design -- a test
# called `test_a_later_development_origin_may_not_look_back_over_the_acceptance_period` is
# self-documenting in a way `test_origins_3` is not.
"autoforecast/test_protocol.py" = ["E501", "E702"]
"autoforecast/test_*.py" = ["E501", "E702"]
"spec/test_*.py" = ["E501", "E702"]
"forecast/models/mft/test_*.py" = ["E501", "E702"]
"forecast/features/test_*.py" = ["E501", "E702"]
"forecast/data/test_*.py" = ["E501", "E702"]
"forecast/scenario/test_*.py" = ["E501", "E702"]
"autoforecast/adapters/test_*.py" = ["E501", "E702"]
"autoforecast/adapters/mft.py" = ["E501"]
# The hand-rolled runners at the foot of each test file pair a call with its report --
# `fn(); print("PASS " + fn.__name__)` -- and splitting them puts the outcome three lines from
# the call it describes. These files run without pytest by design, so the runner is part of them.
#
# The docstrings in the modules below carry the same contract as spec/forecast_spec.py: each
# records the contract it enforces; several quote a runtime
# message verbatim so prose and behaviour cannot drift, and rewrapping changes the quoted text.
"autoforecast/protocol.py" = ["E501"]
"forecast/data/reference.py" = ["E501"]
"autoforecast/score.py" = ["E501"]
# The panel contract's docstrings carry the disposition table and the reasoning behind each
# refusal; the adapter's carry the four source-cell cases. Rewrapping those breaks the tables.
"autoforecast/panel.py" = ["E501", "E402"]
"autoforecast/adapters/naive.py" = ["E501"]
# The head's docstrings carry the formulas it must match and the reasoning behind each numeric
# choice; rewrapping them changes text the parity test argues with.
"forecast/models/mft/heads.py" = ["E501"]
# Analysis scripts print aligned tables; the alignment is the output.
"scripts/size_model.py" = ["E501"]
# Entry-point scripts must extend sys.path before the project imports can resolve,
# so the imports are structurally below code -- the same reason panel.py carries it.
"scripts/run_scenario_contrast.py" = ["E402"]
"scripts/score_latent_demand.py" = ["E402"]
"scripts/bench_inference.py" = ["E402"]
# `sys.path` has to be extended before the spec can be imported, so these imports cannot be
# at the top of the file.
"spec/forecast_spec.py" = ["E501", "E402"]
# The likelihood contract's docstrings ARE the contract: each states the formula an
# implementation must match, and several give the derivation of a hand-computed test value.
# Rewrapping them changes text the tests quote back.
"spec/likelihood.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
