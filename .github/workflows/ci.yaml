name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.32'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Export checked lock and install CPU test runtimes
        run: |
          uv lock --check
          uv export --frozen --no-hashes --no-emit-project --group ci \
            --extra timeseries --extra plots --extra catalog --extra classical --extra shallow \
            --extra tft --extra hpo-optuna --extra hpo-ray --extra mlflow-tracking \
            --extra custom-torch --output-file "$RUNNER_TEMP/constraints.txt"
          uv pip install --system --no-deps --constraint "$RUNNER_TEMP/constraints.txt" \
            torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system --constraint "$RUNNER_TEMP/constraints.txt" \
            --build-constraints "$RUNNER_TEMP/constraints.txt" --group ci
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/wheels"
          python -m scripts.verify_public_release --wheel "$RUNNER_TEMP/wheels/autoforecast-0.1.0-py3-none-any.whl"
          uv pip install --system --constraint "$RUNNER_TEMP/constraints.txt" \
            --build-constraints "$RUNNER_TEMP/constraints.txt" \
            "$RUNNER_TEMP/wheels/autoforecast-0.1.0-py3-none-any.whl[timeseries,plots,catalog,classical,shallow,tft,hpo-optuna,hpo-ray,mlflow-tracking,custom-torch]"
          uv pip check --system
          python - <<'PY'
          import importlib.metadata
          import torch
          assert torch.__version__ == '2.10.0+cpu', torch.__version__
          assert not any(d.metadata['Name'].startswith('nvidia-') for d in importlib.metadata.distributions())
          PY
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright --project pyrightconfig.governed.json
      - name: Unit and workflow regressions
        env:
          FORECAST_SPARK_CORES: '2'
          FORECAST_SPARK_MEMORY: '1g'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: python scripts/run_tests.py
      - name: Installed native model and HPO acceptance
        working-directory: ${{ runner.temp }}
        env:
          FORECAST_SPARK_CORES: '2'
          FORECAST_SPARK_MEMORY: '1g'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: |
          for metric in mae wape; do
            env -u PYTHONPATH python -m scripts.verify_native_study_release "$RUNNER_TEMP/native-study-$metric" \
              --metric "$metric" \
              --model-profile "$GITHUB_WORKSPACE/configs/models/custom/sft/model.yaml" \
              --implementation-config "$GITHUB_WORKSPACE/configs/experiments/multibranch_revisions/sft_campaign_default.json"
          done
  installed-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        input: [parquet, csv]
        python: ['3.12']
        frequency: ['H', 'D', 'W', 'M', 'MS', 'Y', 'YS']
        include:
          - {input: parquet, python: '3.13', frequency: 'D'}
          - {input: csv, python: '3.13', frequency: 'D'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.32'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and install wheel
        run: |
          uv lock --check
          uv export --frozen --no-hashes --no-emit-project --group ci --extra timeseries --extra plots \
            --output-file "$RUNNER_TEMP/constraints.txt"
          uv pip install --system --constraint "$RUNNER_TEMP/constraints.txt" \
            --build-constraints "$RUNNER_TEMP/constraints.txt" --group ci
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/wheels"
          python -m scripts.verify_public_release --wheel "$RUNNER_TEMP/wheels/autoforecast-0.1.0-py3-none-any.whl"
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/timeseries-env"
          uv pip install --python "$RUNNER_TEMP/timeseries-env/bin/python" \
            --constraint "$RUNNER_TEMP/constraints.txt" --build-constraints "$RUNNER_TEMP/constraints.txt" \
            "$RUNNER_TEMP/wheels/autoforecast-0.1.0-py3-none-any.whl[timeseries,plots]"
          uv pip check --python "$RUNNER_TEMP/timeseries-env/bin/python"
      - name: Verify installed package outside checkout
        env:
          FORECAST_SPARK_CORES: '2'
          FORECAST_SPARK_MEMORY: '1g'
          SPARK_LOCAL_IP: '127.0.0.1'
          INPUT_FORMAT: ${{ matrix.input }}
          FREQUENCY: ${{ matrix.frequency }}
        run: |
          cd "$RUNNER_TEMP"
          timeseries-env/bin/python - <<'PY'
          import pathlib
          import autoforecast
          root = pathlib.Path(autoforecast.__file__).parent.parent
          for name in ('autoforecast', 'forecast', 'mlops', 'observability', 'provenance', 'scripts', 'spec'):
              package = root / name
              for path in sorted(package.rglob('*'), reverse=True):
                  path.chmod(0o555 if path.is_dir() else 0o444)
              package.chmod(0o555)
          PY
          if [ "$INPUT_FORMAT" = csv ]; then
            env -u PYTHONPATH timeseries-env/bin/python -m scripts.verify_timeseries_release "$RUNNER_TEMP/project" --frequency "$FREQUENCY" --csv
          else
            env -u PYTHONPATH timeseries-env/bin/python -m scripts.verify_timeseries_release "$RUNNER_TEMP/project" --frequency "$FREQUENCY"
          fi
      - name: Reusable study acceptance
        if: matrix.frequency == 'D' && matrix.input == 'parquet' && matrix.python == '3.12'
        working-directory: ${{ runner.temp }}
        env:
          FORECAST_SPARK_CORES: '2'
          FORECAST_SPARK_MEMORY: '1g'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: env -u PYTHONPATH "$RUNNER_TEMP/timeseries-env/bin/python" -m scripts.verify_study_release "$RUNNER_TEMP/study-project"
