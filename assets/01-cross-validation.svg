<text x="90" y="1075" font-family="Arial, sans-serif" font-size="20" fill="#087F82" xml:space="preserve" font-weight="700">C wins: (2 + 3 + 4) / 3 = 3. Equal weight per window.</text>
<rect x="860" y="664" width="684" height="440" rx="18" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<rect x="882" y="686" width="40" height="36" rx="9" fill="#EAF0FD"/>
<text x="893" y="711" font-family="Arial, sans-serif" font-size="20" fill="#245DD8" xml:space="preserve" font-weight="700">3</text>
<text x="938" y="712" font-family="Arial, sans-serif" font-size="25" fill="#172A43" xml:space="preserve" font-weight="700">Keep selection separate from final evaluation</text>
<text x="886" y="753" font-family="Arial, sans-serif" font-size="23" fill="#172A43" xml:space="preserve">Calls 1–15: five trials × three windows</text>
<text x="886" y="798" font-family="Arial, sans-serif" font-size="23" fill="#172A43" xml:space="preserve">Call 16: fresh validation fit using C</text>
<text x="886" y="843" font-family="Arial, sans-serif" font-size="23" fill="#172A43" xml:space="preserve">Call 17: refit using C through period 14</text>
<rect x="886" y="887" width="632" height="76" rx="12" fill="#EAF0FD"/>
<text x="907" y="932" font-family="Arial, sans-serif" font-size="30" fill="#245DD8" xml:space="preserve" font-weight="700">15 + 1 + 1 = 17 callback calls</text>
<text x="886" y="1001" font-family="Arial, sans-serif" font-size="18" fill="#53647A" xml:space="preserve">Test results never choose the trial settings.</text>
<text x="886" y="1029" font-family="Arial, sans-serif" font-size="18" fill="#53647A" xml:space="preserve">A callback may fit one global model or many series models.</text>
<text x="886" y="1075" font-family="Arial, sans-serif" font-size="18" fill="#53647A" xml:space="preserve">Fresh successful run; no reuse or early failure.</text>
<rect x="56" y="1128" width="1488" height="216" rx="18" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="80" y="1176" font-family="Arial, sans-serif" font-size="25" fill="#172A43" xml:space="preserve" font-weight="700">What controls this example?</text>
<text x="82" y="1210" font-family="Courier New, monospace" font-size="19" fill="#172A43" xml:space="preserve">hpo: {backend: optuna, max_trials: 5, seed: 42}</text>
<text x="82" y="1241" font-family="Courier New, monospace" font-size="19" fill="#172A43" xml:space="preserve">selection: {stage: tuning, origins: all, metric: mae}</text>
<text x="82" y="1284" font-family="Arial, sans-serif" font-size="19" fill="#53647A" xml:space="preserve">Profile fragment; the study already contains three tuning windows.</text>
<text x="82" y="1313" font-family="Arial, sans-serif" font-size="19" fill="#53647A" xml:space="preserve">Fixed settings: 2 calls. Outer-validation search: 5 selection calls + winning-fit reuse + 1 refit = 6 calls.</text>
<text x="56" y="1405" font-family="Arial, sans-serif" font-size="17" fill="#53647A" xml:space="preserve">The same declared series population and scoring rules apply across candidate settings.</text>
<text x="56" y="1430" font-family="Arial, sans-serif" font-size="15" fill="#53647A" xml:space="preserve">Illustrative numbers, not benchmark measurements. See README.md and autoforecast/study_workflow.py.</text>
