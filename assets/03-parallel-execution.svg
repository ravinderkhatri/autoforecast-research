<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Choose where model jobs run</title><desc id="desc">Independent models can run sequentially, on one machine, or on an existing cluster.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#245DD8"/></marker></defs>
<rect width="1200" height="800" fill="#F4F7FB"/>
<text x="40" y="37" font-family="Arial, sans-serif" font-size="14" fill="#245DD8" font-weight="700">AUTOFORECAST / CAPABILITIES</text>
<text x="40" y="84" font-family="Arial, sans-serif" font-size="32" fill="#172A43" font-weight="700">Choose where model jobs run</text>
<text x="40" y="119" font-family="Arial, sans-serif" font-size="18" fill="#53647A">Independent models can run sequentially, on one machine, or on an existing cluster.</text>
<rect x="40" y="160" width="360" height="420" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="60" y="198" font-family="Arial, sans-serif" font-size="25" fill="#245DD8" font-weight="700">Sequential</text>
<text x="60" y="227" font-family="Arial, sans-serif" font-size="16" fill="#53647A">One job after another</text>
<rect x="420" y="160" width="360" height="420" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="440" y="198" font-family="Arial, sans-serif" font-size="25" fill="#245DD8" font-weight="700">Local parallel</text>
<text x="440" y="227" font-family="Arial, sans-serif" font-size="16" fill="#53647A">Separate processes on one machine</text>
<rect x="800" y="160" width="360" height="420" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="820" y="198" font-family="Arial, sans-serif" font-size="25" fill="#245DD8" font-weight="700">Cluster</text>
<text x="820" y="227" font-family="Arial, sans-serif" font-size="16" fill="#53647A">Jobs placed across worker machines</text>
<rect x="90" y="257" width="260" height="66" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="110" y="291" font-family="Arial, sans-serif" font-size="21" fill="#087F82" font-weight="700">Model A</text>
<rect x="90" y="359" width="260" height="66" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="110" y="393" font-family="Arial, sans-serif" font-size="21" fill="#087F82" font-weight="700">Model B</text>
<rect x="90" y="461" width="260" height="66" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="110" y="495" font-family="Arial, sans-serif" font-size="21" fill="#087F82" font-weight="700">Model C</text>
<path d="M220 323 L220 352" fill="none" stroke="#245DD8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M220 425 L220 454" fill="none" stroke="#245DD8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="442" y="254" width="316" height="290" rx="14" fill="#EAF0FD" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="461" y="285" font-family="Arial, sans-serif" font-size="18" fill="#245DD8" font-weight="700">Shared machine budget</text>
<rect x="458" y="315" width="132" height="143" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="474" y="355" font-family="Arial, sans-serif" font-size="20" fill="#087F82" font-weight="700">Model A</text>
<text x="474" y="389" font-family="Arial, sans-serif" font-size="15" fill="#172A43">Own process</text>
<text x="474" y="416" font-family="Arial, sans-serif" font-size="15" fill="#172A43">Own run</text>
<rect x="611" y="315" width="132" height="143" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="627" y="355" font-family="Arial, sans-serif" font-size="20" fill="#087F82" font-weight="700">Model B</text>
<text x="627" y="389" font-family="Arial, sans-serif" font-size="15" fill="#172A43">Own process</text>
<text x="627" y="416" font-family="Arial, sans-serif" font-size="15" fill="#172A43">Own run</text>
<text x="461" y="500" font-family="Arial, sans-serif" font-size="16" fill="#53647A">Extra jobs wait for resources.</text>
<rect x="828" y="257" width="304" height="78" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="848" y="291" font-family="Arial, sans-serif" font-size="21" fill="#245DD8" font-weight="700">Coordinator</text>
<text x="848" y="326" font-family="Arial, sans-serif" font-size="17" fill="#172A43">Schedules independent jobs</text>
<path d="M909 335 L866 382" fill="none" stroke="#245DD8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1052 335 L1093 382" fill="none" stroke="#245DD8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="820" y="392" width="150" height="130" rx="14" fill="#E8F5F3" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="835" y="425" font-family="Arial, sans-serif" font-size="19" fill="#087F82" font-weight="700">Worker 1</text>
<text x="835" y="464" font-family="Arial, sans-serif" font-size="17" fill="#172A43">Model job</text>
<rect x="990" y="392" width="150" height="130" rx="14" fill="#E8F5F3" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="1005" y="425" font-family="Arial, sans-serif" font-size="19" fill="#087F82" font-weight="700">Worker 2</text>
<text x="1005" y="464" font-family="Arial, sans-serif" font-size="17" fill="#172A43">Model job</text>
<rect x="40" y="614" width="1120" height="137" rx="14" fill="white" stroke="#D8E1ED" stroke-width="1.5"/>
<text x="60" y="649" font-family="Arial, sans-serif" font-size="22" fill="#172A43" font-weight="700">The evaluation contract stays the same</text>
<text x="60" y="683" font-family="Arial, sans-serif" font-size="18" fill="#172A43">All jobs use the same frozen study. CPU, memory and GPU budgets limit concurrency.</text>
<text x="60" y="714" font-family="Arial, sans-serif" font-size="18" fill="#172A43">Trials and windows within a model job stay sequential. Workers need shared code and storage.</text>
<text x="40" y="781" font-family="Arial, sans-serif" font-size="15" fill="#53647A">Cluster execution requires an existing Ray cluster; real two-machine validation remains pending.</text>
</svg>
